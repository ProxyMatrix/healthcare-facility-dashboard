# Konfigurasi Nginx PRODUKSI — HTTPS wajib, proxy ke app & MinIO, header
# keamanan dasar.
#
# CATATAN PENTING: file ini dipakai sebagai TEMPLATE. Image resmi nginx:alpine
# otomatis menjalankan `envsubst` pada variabel ${DOMAIN} dan
# ${MAX_PHOTO_SIZE_MB} di bawah setiap kali container start, memakai nilai
# environment yang dikirim lewat docker-compose.prod.yml (yang mengambilnya
# dari file .env project) — lihat komentar service `nginx` di
# docker-compose.prod.yml. Jangan isi domain/angka secara manual di sini.

# ============================================================================
# Port 80 — redirect semua trafik ke HTTPS, KECUALI validasi ACME challenge
# dari Let's Encrypt (certbot butuh path ini tetap bisa diakses lewat HTTP
# biasa, baik saat penerbitan sertifikat awal maupun perpanjangan otomatis).
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================================
# Port 443 — HTTPS sungguhan, proxy ke aplikasi Next.js dan ke MinIO (foto
# dokter), lengkap dengan header keamanan.
# ============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ${DOMAIN};
    http2 on;

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # --- Header keamanan dasar ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Kompresi ---
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript
        text/javascript text/xml application/xml application/xml+rss
        image/svg+xml;

    # Samakan dengan MAX_PHOTO_SIZE_MB di .env, supaya upload foto dokter
    # tidak ditolak Nginx sebelum sempat divalidasi aplikasi.
    client_max_body_size ${MAX_PHOTO_SIZE_MB}M;

    # Tetap sediakan path ACME challenge di sini juga -- perpanjangan
    # sertifikat (certbot renew) bisa terjadi kapan saja saat HTTPS sudah
    # aktif, jadi permintaan http://domain/.well-known/... harus tetap
    # dilayani walau browser pasien selalu diarahkan ke https.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Foto dokter di MinIO diakses lewat domain utama (path /storage/),
    # supaya browser pasien tidak perlu tahu alamat/port MinIO internal.
    # Trailing slash di location DAN proxy_pass sengaja dipasang bersamaan
    # supaya prefix "/storage/" dibuang saat diteruskan ke MinIO — sisanya
    # (nama bucket + object key) tetap utuh, persis format URL yang
    # dibangun getPublicUrl() di lib/minio.js.
    location /storage/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
