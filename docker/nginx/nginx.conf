# Konfigurasi Nginx untuk mode DEVELOPMENT (opsional).
#
# File ini TIDAK dijalankan otomatis oleh docker-compose.yml -- docker-compose.yml
# hanya berisi 3 service (postgres, minio, app) yang bisa diakses langsung
# lewat port masing-masing. Konfigurasi ini disediakan untuk developer yang
# ingin mengetes aplikasi di belakang reverse proxy secara lokal sebelum ke
# produksi. Untuk produksi sungguhan (HTTPS, Certbot, security header),
# lihat docker/nginx/nginx.prod.conf beserta docker-compose.prod.yml.

events {
    worker_connections 1024;
}

http {
    upstream app {
        server app:3000;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 5M;

        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
