# docker-compose.prod.yml — lingkungan PRODUKSI.
#
# File ini BERDIRI SENDIRI (bukan override dari docker-compose.yml) supaya
# port development (5432, 9000, 9001, 3000 -- lihat docker-compose.yml) TIDAK
# PERNAH ter-mapping ke host produksi meski developer lupa. Jalankan dengan:
#   docker compose -f docker-compose.prod.yml up -d
#
# Hanya service `nginx` yang membuka port ke luar (80 & 443). postgres, minio,
# dan app SENGAJA tidak punya blok "ports:" sama sekali -- cuma bisa
# dijangkau container lain lewat jaringan internal Docker, tidak pernah
# lewat host. Ini mengurangi permukaan serangan: database & storage tidak
# bisa diakses langsung dari internet sama sekali, semua trafik publik wajib
# lewat Nginx (yang menerapkan HTTPS + header keamanan).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Jakarta
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: Asia/Jakarta
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: Asia/Jakarta
      DATABASE_URL: ${DATABASE_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME}
      SESSION_MAX_AGE_DAYS: ${SESSION_MAX_AGE_DAYS}
      MAX_PHOTO_SIZE_MB: ${MAX_PHOTO_SIZE_MB}
      ALLOWED_IMAGE_TYPES: ${ALLOWED_IMAGE_TYPES}
      FACILITY_NAME: ${FACILITY_NAME}
      FACILITY_TIMEZONE: ${FACILITY_TIMEZONE}
      APP_URL: ${APP_URL}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Dibaca lewat envsubst di dalam docker/nginx/nginx.prod.conf -- lihat
      # catatan di bagian atas file itu.
      DOMAIN: ${DOMAIN}
      MAX_PHOTO_SIZE_MB: ${MAX_PHOTO_SIZE_MB}
    volumes:
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/templates/default.conf.template:ro
      - ./docker/certbot/conf:/etc/letsencrypt:ro
      - ./docker/certbot/www:/var/www/certbot:ro
    depends_on:
      - app
      - minio

  # Memperbarui sertifikat Let's Encrypt secara otomatis setiap 12 jam
  # (certbot sendiri hanya benar-benar memperbarui kalau sertifikat sudah
  # mendekati kedaluwarsa, jadi aman dijalankan sesering ini). Penerbitan
  # sertifikat PERTAMA KALI dilakukan lewat docker/init-letsencrypt.sh,
  # bukan lewat service ini.
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./docker/certbot/conf:/etc/letsencrypt
      - ./docker/certbot/www:/var/www/certbot
    entrypoint: >
      sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'

volumes:
  pgdata:
  miniodata:
